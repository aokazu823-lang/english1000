<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英単語1000問チャレンジ iPad採点表示</title><script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:"Yu Gothic UI","Meiryo",sans-serif;background:#101828;color:#fff;min-height:100vh;display:grid;place-items:center;padding:24px}.wrap{width:min(900px,100%);text-align:center}.connect{background:#fff;color:#101828;border-radius:18px;padding:22px}.connect input{font-size:32px;text-align:center;letter-spacing:.18em;width:260px;max-width:100%;padding:12px;border:2px solid #98a2b3;border-radius:12px}.connect button{font-size:20px;padding:13px 24px;margin-top:12px;border:0;border-radius:10px;background:#155eef;color:#fff;font-weight:800}.status{margin-top:12px;color:#667085}.screen{display:none}.name{font-size:26px;color:#b2ccff}.count{font-size:22px;margin:12px}.prompt{font-size:38px;font-weight:800;margin:22px 0}.answer{font-size:55px;font-weight:900;background:#fff;color:#101828;border-radius:20px;padding:32px;min-height:180px;display:grid;place-items:center;white-space:pre-wrap}.mark{font-size:80px;font-weight:900;margin-top:18px}.ok{color:#32d583}.bad{color:#f97066}.finish{font-size:52px;font-weight:900}.muted{color:#d0d5dd;font-size:22px}</style></head><body><div class="wrap"><div id="connect" class="connect"><h1>iPad採点表示</h1><p>PCに表示された6桁の接続コードを入力</p><input id="code" inputmode="numeric" maxlength="6" placeholder="000000"><br><button onclick="connect()">接続する</button><div id="status" class="status">未接続</div></div><div id="screen" class="screen"><div id="name" class="name"></div><div id="count" class="count"></div><div id="prompt" class="prompt"></div><div id="answer" class="answer"></div><div id="mark" class="mark"></div></div></div><script>let peer,conn;function show(id){document.getElementById('connect').style.display=id==='connect'?'block':'none';document.getElementById('screen').style.display=id==='screen'?'block':'none'}function connect(){const code=document.getElementById('code').value.trim();if(!/^\d{6}$/.test(code))return alert('6桁のコードを入力してください。');document.getElementById('status').textContent='接続中…';peer=new Peer();peer.on('open',()=>{conn=peer.connect('eigo-pc-'+code);conn.on('open',()=>{document.getElementById('status').textContent='接続しました';show('screen')});conn.on('data',render);conn.on('close',()=>{show('connect');document.getElementById('status').textContent='接続が切れました'});conn.on('error',()=>document.getElementById('status').textContent='通信エラー')});peer.on('error',()=>document.getElementById('status').textContent='接続できませんでした')}function render(d){show('screen');const name=document.getElementById('name'),count=document.getElementById('count'),prompt=document.getElementById('prompt'),answer=document.getElementById('answer'),mark=document.getElementById('mark');mark.textContent='';mark.className='mark';if(d.type==='idle'){name.textContent=d.title||'';count.textContent='';prompt.textContent=d.message||'';answer.textContent='待機中';return}if(d.type==='grading'){name.textContent=(d.participant||'')+'　'+(d.testId||'');count.textContent=(d.index||0)+' / '+(d.total||50)+'問';prompt.textContent='問題：'+(d.prompt||'');answer.textContent=d.answer||'';return}if(d.type==='mark'){mark.textContent=d.correct?'○':'×';mark.className='mark '+(d.correct?'ok':'bad');return}if(d.type==='finish'){name.textContent=d.participant||'';count.textContent=(d.score||0)+' / '+(d.total||50)+'点';prompt.textContent='採点終了';answer.innerHTML='<div class="finish">'+(d.passed?'クリア！':'再テスト')+'</div>';return}}</script></body></html>
